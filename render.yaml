# Render Blueprint — static site deploy for the IFE Data Dashboard.
# Dashboard: New + > Blueprint > pick this repo.
services:
  - type: web
    runtime: static
    name: ife-data-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite 8 needs Node 20.19+ / 22.12+
      - key: NODE_VERSION
        value: 22
    routes:
      # SPA fallback so /team/:id, /student/:id, /auth, /admin work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
